name: Update language card

on:
  schedule:
    # 每天 03:17 UTC（北京时间 11:17）自动运行一次。
    # GitHub 在高峰时段可能延迟几分钟到几十分钟，这是正常现象。
    - cron: "17 3 * * *"
  push:
    branches: [main]
    # 首次推送 workflow 时立即跑一次；之后由上面的 cron 每天自动更新。
    # 忽略 Actions 自己提交 SVG 产生的 push，避免循环触发。
    paths-ignore:
      - assets/languages.svg
  # 仅保留给调试用，日常和首次运行都不需要手动点它。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-language-card
  cancel-in-progress: true

jobs:
  update-card:
    runs-on: ubuntu-latest
    # 需要浅量下载并分析所有仓库，给足时间。
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cloc
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc

      - name: Generate SVG card
        env:
          # 自动 token：只用于提交生成后的 SVG。
          GITHUB_TOKEN: ${{ github.token }}
          # 只读 PAT：用于列出并下载公开 + 私有仓库。
          # 在仓库 Settings -> Secrets and variables -> Actions 中添加。
          LANGUAGE_STATS_TOKEN: ${{ secrets.LANGUAGE_STATS_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
          LANGUAGE_STATS_INCLUDE_FORKS: "false"
          LANGUAGE_STATS_INCLUDE_ARCHIVED: "true"
          LANGUAGE_STATS_INCLUDE_PRIVATE: "true"
          LANGUAGE_STATS_MAX_ROWS: "10"
          LANGUAGE_STATS_EXCLUDE_REPOS: ""
          LANGUAGE_STATS_WORKERS: "4"
          LANGUAGE_STATS_CLOC_EXCLUDE_DIRS: ".git,node_modules,vendor,dist,build,target,coverage,.venv,venv,__pycache__,Pods,.next,.nuxt"
          LANGUAGE_STATS_CLOC_TIMEOUT: "900"
          LANGUAGE_STATS_TITLE: "语言代码行数占比"
        run: python scripts/generate_language_stats.py

      - name: Commit the updated card
        run: |
          if git diff --quiet -- assets/languages.svg; then
            echo "Language card is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg
          git commit -m "chore: update language card"
          git push
